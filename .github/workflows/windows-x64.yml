name: windows-x64.yml
on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/windows-x64.yml'
      - 'CMakeLists.txt'
      - 'cmake/**'
      - 'src/*'
      - 'src/layer/*'
      - 'src/layer/cuda/**'
      - 'tests/**'
      - 'tools/**'
      - '!tools/pnnx/**'
      - 'examples/**'
  pull_request:
    branches: [master]
    paths:
      - '.github/workflows/windows-x64.yml'
      - 'CMakeLists.txt'
      - 'cmake/**'
      - 'src/*'
      - 'src/layer/*'
      - 'src/layer/cuda/**'
      - 'tests/**'
      - 'tools/**'
      - '!tools/pnnx/**'
      - 'examples/**'

jobs:
  windows:
    runs-on: windows-2022
    strategy:
      matrix:
        include:
          - vs-version: vs2019
            toolset-version: v142
            windows-sdk-version: 26100
          - vs-version: vs2022
            toolset-version: v143
            windows-sdk-version: 26100

    env:
      UseMultiToolTask: true
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: GuillaumeFalourd/setup-windows10-sdk-action@v2.4
        with:
          sdk-version: ${{ matrix.windows-sdk-version }}

      - name: cache-protobuf
        id: cache-protobuf
        uses: actions/cache@v5
        with:
          path: "protobuf-install"
          key: protobuf-${{ matrix.vs-version }}-x64-install-3

      - name: protobuf
        if: steps.cache-protobuf.outputs.cache-hit != 'true'
        run: |
          Invoke-WebRequest -Uri https://github.com/protocolbuffers/protobuf/archive/v3.11.2.zip -OutFile protobuf-3.11.2.zip
          7z x ./protobuf-3.11.2.zip
          cd protobuf-3.11.2
          mkdir build-${{ matrix.vs-version }}; cd build-${{ matrix.vs-version }}
          cmake -T ${{ matrix.toolset-version }},host=x64 -A x64,version=10.0.${{ matrix.windows-sdk-version }}.0 -DCMAKE_INSTALL_PREFIX="$env:GITHUB_WORKSPACE\protobuf-install" -Dprotobuf_BUILD_TESTS=OFF -Dprotobuf_MSVC_STATIC_RUNTIME=OFF -DNCNN_BUILD_TESTS=ON ../cmake
          cmake --build . --config Release -j 4
          cmake --build . --config Release --target install
      - name: cache-swiftshader
        if: matrix.vs-version != 'vs2015' && matrix.vs-version != 'vs2017'
        id: cache-swiftshader
        uses: actions/cache@v5
        with:
          path: swiftshader-install
          key: swiftshader-${{ matrix.vs-version }}-x64-install-20251010

      # - name: x64 CUDA-ON (compile-only)
      #   run: |
      #     mkdir build-x64-cuda
      #     cd build-x64-cuda
      #     cmake -DNCNN_CUDA=ON ..X
      # 公有github Actions 并不支持CUDA  什么时候有私有 GPU CI 再启用
          
      - name: x64 CUDA-OFF
        run: |
          mkdir build-x64; cd build-x64
          cmake -T ${{ matrix.toolset-version }},host=x64 -A x64,version=10.0.${{ matrix.windows-sdk-version }}.0 -Dprotobuf_DIR="$env:GITHUB_WORKSPACE\protobuf-install\cmake" -DNCNN_CUDA=OFF -DNCNN_BUILD_TESTS=ON ..
          cmake --build . --config Release -j 4
            
